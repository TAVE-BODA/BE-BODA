# =============================================
# 회귀 테스트(골든 마스터) 전용 프로필
# DB는 Testcontainers(@ServiceConnection)가 주입한다.
# 외부 연동은 사용하지 않으므로 전부 더미 값.
# =============================================
# 실제 접속 정보는 @ServiceConnection이 덮어쓴다. (기본 설정의 ${DB_HOST} 등 미해결 값 방지용)
spring.datasource.url=jdbc:postgresql://localhost:5432/overridden-by-testcontainers
spring.datasource.username=overridden
spring.datasource.password=overridden
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

spring.ai.openai.api-key=golden-dummy
spring.ai.openai.chat.options.model=golden-dummy
app.llm.mini-model=golden-dummy
app.llm.full-model=golden-dummy

kakao.client-id=dummy
kakao.client-secret=dummy
kakao.redirect-uri=http://localhost
cloud.aws.credentials.access-key=dummy
cloud.aws.credentials.secret-key=dummy
cloud.aws.s3.bucket=dummy
clova.ocr.invoke-url=http://localhost/clova-disabled
clova.ocr.secret-key=dummy
