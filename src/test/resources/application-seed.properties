# =============================================
# 픽스처 생성(FixtureSeeder) 전용 프로필
# 로컬 Docker PostgreSQL에 증권/약관 분석 결과를 한 번만 생성한다.
# =============================================

# 로컬 Docker PostgreSQL (docker run ... -p 55432:5432)
spring.datasource.url=jdbc:postgresql://localhost:55432/boda
spring.datasource.username=boda
spring.datasource.password=boda
spring.jpa.hibernate.ddl-auto=update

# 증권 분석에만 사용 (배포 환경과 같은 모델)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.4-mini
app.llm.mini-model=gpt-5.4-mini
app.llm.full-model=gpt-5.4

# 시딩에서는 사용하지 않는 외부 연동 (빈 생성용 더미 값)
kakao.client-id=dummy
kakao.client-secret=dummy
kakao.redirect-uri=http://localhost
cloud.aws.credentials.access-key=dummy
cloud.aws.credentials.secret-key=dummy
cloud.aws.s3.bucket=dummy
clova.ocr.invoke-url=${CLOVA_OCR_INVOKE_URL:http://localhost/clova-disabled}
clova.ocr.secret-key=${CLOVA_OCR_SECRET_KEY:dummy}
